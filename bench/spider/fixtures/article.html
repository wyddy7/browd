<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider — fixture article</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101114; color: #e6e6e6; font: 15px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font: 400 34px/1.2 Georgia, serif; border-bottom: 1px solid #333; padding-bottom: 8px; }
  h2 { font: 400 24px/1.3 Georgia, serif; border-bottom: 1px solid #333; margin-top: 36px; }
  a { color: #8ab4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .card { display: flex; gap: 12px; align-items: center; padding: 16px; border: 1px solid #333; border-radius: 10px; margin: 20px 0; }
  .card input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #17181c; color: #eee; font-size: 15px; }
  .card button { padding: 10px 18px; border-radius: 8px; border: 0; background: #6d5cff; color: #fff; font-size: 15px; cursor: pointer; }
  #count { color: #9aa0a6; font-size: 13px; }
  ol li { margin: 4px 0; }
  .isbn { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Spider</h1>
  <p>Spiders (order <a href="#araneae">Araneae</a>) are air-breathing <a href="#arthropods">arthropods</a> that have eight legs,
    <a href="#chelicerae">chelicerae</a> with fangs generally able to inject venom, and <a href="#spinnerets">spinnerets</a>
    that extrude <a href="#silk">silk</a>. They are the largest order of <a href="#arachnids">arachnids</a>.</p>

  <div class="card" id="signup">
    <input id="email" type="email" placeholder="Email for the newsletter" autocomplete="off">
    <button id="subscribe" type="button">Subscribe</button>
    <span id="count">0 subscribers</span>
  </div>

  <p>Continue to the <a id="next" href="second.html">second page</a>.</p>

  <h2>Further reading</h2>
  <ol id="refs"></ol>
</main>
<script>
  // Static after load: the e2e watches for DOM mutations after this point.
  window.__clicks = [];
  document.addEventListener('click', e => {
    window.__clicks.push({ t: Date.now(), x: e.clientX, y: e.clientY, id: e.target.id || e.target.tagName, trusted: e.isTrusted });
  }, true);
  let n = 0;
  document.getElementById('subscribe').addEventListener('click', () => {
    document.getElementById('count').firstChild.nodeValue = `${++n} subscriber${n === 1 ? '' : 's'}`;
  });
  const authors = ['Bilger, Burkhard', 'Bristowe, W. S.', 'Crompton, John', 'Hillyard, Paul', 'Kaston, B. J.', 'Main, Barbara York',
    'Wise, David A.', 'Foelix, Rainer F.', 'Selden, P.A.', 'Coddington, J.A.', 'Vetter, Richard S.', 'Penney, D.'];
  const titles = ['The World of Spiders', 'The Life of the Spider', 'The Book of the Spider', 'Spiders in Ecological Webs',
    'Biology of Spiders', 'Oldest spider web found in amber', 'Phylogeny and Classification of Spiders', 'Medical Aspects of Spider Bites'];
  const ol = document.getElementById('refs');
  for (let i = 0; i < 140; i++) {
    const li = document.createElement('li');
    const a = authors[i % authors.length];
    const t = titles[(i * 7) % titles.length];
    li.innerHTML = `${a} (${1950 + (i * 3) % 70}). <a href="#ref${i}"><i>${t}</i></a>. Press. ` +
      `ISBN <a class="isbn" href="#isbn${i}">978-0-${(100 + i) % 999}-${(10000 + i * 37) % 99999}-${i % 10}</a>. ` +
      `<a href="#doi${i}">doi:10.1111/j.${1096 + i}</a>`;
    ol.appendChild(li);
  }
</script>
</body>
</html>
