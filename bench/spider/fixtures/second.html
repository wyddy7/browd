<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spider — second page</title>
<style>
  body { margin: 0; background: #f7f7f5; color: #1d1d1f; font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  form { display: grid; gap: 12px; margin-top: 24px; max-width: 420px; }
  label { font-size: 14px; color: #555; }
  input { padding: 10px 12px; border: 1px solid #c8c8c8; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1d1d1f; color: #fff; font-size: 15px; cursor: pointer; justify-self: start; }
  #done { color: #137333; min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <h1>Join the arachnid society</h1>
  <p>Light page on purpose: the spider has to stay visible on white as well as on dark.</p>
  <form id="join" onsubmit="return false">
    <label for="member-email">Email</label>
    <input id="member-email" type="email" autocomplete="off">
    <button id="join-button" type="button">Join</button>
    <div id="done"></div>
  </form>
</main>
<script>
  window.__clicks = [];
  document.addEventListener('click', e => {
    window.__clicks.push({ t: Date.now(), x: e.clientX, y: e.clientY, id: e.target.id || e.target.tagName, trusted: e.isTrusted });
  }, true);
  document.getElementById('join-button').addEventListener('click', () => {
    const v = document.getElementById('member-email').value;
    document.getElementById('done').textContent = v ? `Welcome, ${v}` : 'Email is required';
  });
</script>
</body>
</html>
